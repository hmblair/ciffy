# Test configuration for quick training verification
model:
  latent_dim: 16
  hidden_dim: 32
  num_layers: 1
  num_heads: 4
  dropout: 0.0
  beta: 1.0

data:
  data_dir: ./tests/data
  scale: chain
  max_atoms: 10000

training:
  epochs: 2
  lr: 0.001
  seed: 42
  device: cpu
  grad_clip: 1.0

output:
  checkpoint_dir: /tmp/ciffy_vae_test/checkpoints
  sample_dir: /tmp/ciffy_vae_test/samples
  save_every: 1
  n_perturbations: 2
  perturbation_scale: 0.5
