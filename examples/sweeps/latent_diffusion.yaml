# W&B Sweep configuration for latent diffusion hyperparameter search
#
# Usage:
#   wandb sweep configs/sweeps/latent_diffusion.yaml
#   sbatch scripts/slurm/run_sweep.sh <sweep-id>

program: scripts/train_latent_diffusion.py
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Learning rate (log scale)
  --lr:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001

  # Model architecture
  --d-model:
    values: [128, 256, 512]

  --num-layers:
    values: [4, 6, 8]

  --num-heads:
    values: [4, 8]

  # Diffusion settings
  --num-timesteps:
    values: [500, 1000]

  --noise-schedule:
    values: ["cosine", "linear"]

# Early termination for bad runs
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 3
