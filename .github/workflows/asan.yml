name: AddressSanitizer

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gperf libasan8

      - name: Install dependencies
        run: |
          pip install numpy pytest pytest-xdist
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build with AddressSanitizer
        run: |
          CFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" \
          LDFLAGS="-fsanitize=address" \
          pip install -e .

      - name: Run tests with ASan
        env:
          ASAN_OPTIONS: abort_on_error=0:print_stacktrace=1:detect_leaks=0:verify_asan_link_order=0
        run: |
          # Find and preload the ASan runtime library
          ASAN_LIB=$(gcc -print-file-name=libasan.so)
          echo "Using ASan library: $ASAN_LIB"
          # Run without xdist (-n auto) to avoid multiprocess issues with ASan
          LD_PRELOAD="$ASAN_LIB" pytest tests/ -v --ignore=tests/profile.py --ignore=tests/nn/
