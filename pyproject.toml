[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel", "numpy", "PyYAML"]
build-backend = "setuptools.build_meta"

[project]
name = "ciffy"
dynamic = ["version"]
description = "Fast mmCIF parser for structural biology"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Hamish M. Blair"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy", "rich"]

[project.optional-dependencies]
torch = ["torch"]
vis = ["matplotlib"]
nn = ["torch>=2.0", "lightning>=2.0", "safetensors>=0.4"]
dev = ["pytest", "pytest-xdist", "torch", "matplotlib", "biopython", "mypy"]

[project.scripts]
ciffy = "ciffy.cli:main"

[project.urls]
Homepage = "https://github.com/hmblair/ciffy"
Repository = "https://github.com/hmblair/ciffy"

[tool.setuptools]
packages = [
    "ciffy",
    "ciffy._selection",
    "ciffy.backend",
    "ciffy.biochemistry",
    "ciffy.cli",
    "ciffy.datasets",
    "ciffy.geometry",
    "ciffy.io",
    "ciffy.operations",
    "ciffy.polymer",
    "ciffy.utils",
    "ciffy.visualize",
    # Excluded from distribution (research code):
    # ciffy.nn, ciffy.sampling
]

[tool.setuptools.package-data]
ciffy = ["data/*.npz"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
tag_regex = "^v(?P<version>.*)$"
write_to = "ciffy/_version.py"
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --ignore=tests/profile.py"
# For parallel execution: pytest -n auto (requires pytest-xdist)

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests -v --ignore={project}/tests/profile.py"

[tool.cibuildwheel.linux]
before-all = "yum install -y gperf || apt-get update && apt-get install -y gperf || apk add gperf"
before-build = "pip install numpy"

[tool.cibuildwheel.macos]
before-all = "brew install libomp gperf"
before-build = "pip install numpy"
environment = { CIFFY_NO_OPENMP="1" }
# Note: OpenMP disabled on macOS wheels to avoid libomp conflicts with user environments.
# Users can build from source with OpenMP if needed.

[tool.cibuildwheel.windows]
before-build = "pip install numpy"
environment = { CIFFY_NO_OPENMP="1" }

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
]

[[tool.mypy.overrides]]
module = "ciffy._c"
ignore_errors = true

[[tool.mypy.overrides]]
module = "ciffy.nn.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "ciffy.sampling.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "ciffy.flow"
ignore_errors = true

[[tool.mypy.overrides]]
module = "ciffy.cli.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "ciffy.backend.*"
disallow_untyped_defs = true
